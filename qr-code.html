<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生成二维码 · 艾草 3D 展示站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 20% 0%, #1c2b33 0%, #0f1720 60%, #0a0f16 100%);
      color: #eaf2f6; padding: 20px;
    }
    .card {
      width: min(460px, 100%); background: rgba(10,18,26,.6);
      border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
      padding: 26px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: rgba(234,242,246,.7); margin-bottom: 18px; line-height: 1.6; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; color: rgba(234,242,246,.85); }
    input[type=url], select {
      width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 14px;
      border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06);
      color: #eaf2f6; outline: none;
    }
    input[type=url]:focus { border-color: #7fe0ae; }
    select option { color: #111; }
    .row { display: flex; gap: 10px; align-items: end; }
    .row > div:first-child { flex: 1; }
    button {
      margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; color: #0a0f16;
      background: linear-gradient(90deg, #5cd98c, #7fe0ae);
    }
    button:hover { filter: brightness(1.08); }
    #qrWrap { display: none; margin-top: 20px; text-align: center; }
    #qrWrap img {
      width: min(320px, 70vw); height: auto; border-radius: 12px;
      background: #fff; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
    #qrWrap .note { font-size: 12.5px; color: rgba(234,242,246,.65); margin-top: 12px; line-height: 1.7; }
    .hint2 { margin-top: 14px; font-size: 12px; color: rgba(234,242,246,.55); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 生成分享二维码</h1>
    <p class="sub">把网站部署上线后，将网址粘贴到这里，即可生成二维码。别人用微信 / 支付宝 / 相机扫码即可打开。</p>

    <label for="url">网站地址（部署完成后填写）</label>
    <input type="url" id="url" placeholder="https://你的用户名.github.io/aicao-viewer/" />

    <div class="row">
      <div>
        <label for="size">二维码清晰度（打印建议选 512 以上）</label>
        <select id="size">
          <option value="256">256 × 256（适合手机屏幕展示）</option>
          <option value="512" selected>512 × 512（适合打印 A4）</option>
          <option value="1024">1024 × 1024（高清打印）</option>
        </select>
      </div>
    </div>

    <button id="makeBtn">生成二维码</button>

    <div id="qrWrap">
      <img id="qrImg" alt="二维码" />
      <div class="note">💡 电脑上：在二维码图片上<strong>右键 → 图片另存为</strong>即可保存打印。<br/>也可以直接截图。</div>
    </div>
    <div class="hint2">本工具调用免费的 <a href="https://goqr.me" target="_blank" style="color:#7fe0ae">goqr.me</a> 在线接口，需要联网。</div>
  </div>

  <script>
    const urlInput = document.getElementById('url');
    const sizeSel = document.getElementById('size');
    const makeBtn = document.getElementById('makeBtn');
    const qrWrap = document.getElementById('qrWrap');
    const qrImg = document.getElementById('qrImg');

    makeBtn.addEventListener('click', function () {
      let url = urlInput.value.trim();
      if (!url) { alert('请先粘贴网站地址'); return; }
      if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; urlInput.value = url; }
      const size = sizeSel.value;
      // goqr.me 免费二维码 API
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size +
                  '&margin=8&data=' + encodeURIComponent(url);
      qrWrap.style.display = 'block';
    });

    urlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') makeBtn.click();
    });
  </script>
</body>
</html>
